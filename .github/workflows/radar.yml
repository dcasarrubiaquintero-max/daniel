name: EdgeBet AI Radar

on:
  push:
    paths:
      - "radar_engine.py"
      - "scores365_client.py"
      - ".github/workflows/radar.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: edgebet-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate radar
        run: python radar_engine.py
        continue-on-error: false

      - name: Publish radar data
        run: |
          git config user.name "EdgeBet AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/radar.json /tmp/radar.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/radar.json data/radar.json
          git add data/radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update EdgeBet radar"
          git push origin HEAD:main
